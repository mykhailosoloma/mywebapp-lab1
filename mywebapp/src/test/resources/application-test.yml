spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
app:
  server:
    host: 0.0.0.0
    port: 8080
  database:
    host: localhost
    port: 5432
    name: mywebapp
    user: sa
    password: ""